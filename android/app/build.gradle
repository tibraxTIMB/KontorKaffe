plugins { id 'com.android.application' }
android {
 namespace 'no.kontorkaffe.barista'
 compileSdk 35
 defaultConfig {
  applicationId 'no.kontorkaffe.barista'
  minSdk 26
  targetSdk 35
  versionCode 19
  versionName '1.9'
 }
 sourceSets { main { assets.srcDirs += layout.buildDirectory.dir('generated/kkAssets').get().asFile } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

tasks.register('syncKontorKaffeAssets', Sync) {
 from(rootProject.file('../site')) {
  include 'admin/index.html','admin/barista.css','admin/admin.js','admin/icon.svg','admin/manifest.webmanifest','style.css','common.js','config.js','assets/firenze.svg','assets/marble.svg'
 }
 into layout.buildDirectory.dir('generated/kkAssets/kk')
}
tasks.named('preBuild').configure { dependsOn tasks.named('syncKontorKaffeAssets') }
