name: KontorKaffe isolated hosting package
on:
  push:
    branches: [main]
    paths: ['site/**','.github/workflows/site-package.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check modules and package site
        run: |
          node --input-type=module --check < site/customer.js
          node --input-type=module --check < site/admin/admin.js
          node --input-type=module --check < site/common.js
          test -s site/kontorkaffe-verify.txt
          mkdir -p dist
          (cd site && zip -qr ../dist/KontorKaffe-site.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: KontorKaffe-isolated-site
          path: dist/KontorKaffe-site.zip
          retention-days: 30
