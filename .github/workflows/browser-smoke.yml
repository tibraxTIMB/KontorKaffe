name: KontorKaffe browser QA
on:
  push:
    branches: [main]
    paths: ['site/**','tests/**','.github/workflows/browser-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify approved original photo bytes
        run: echo 'b212b152f32a8388ff5dc5198d0556a3962e4de928a7411e026bf6efdb0a6f3a  site/assets/linea-photo.webp' | sha256sum -c -
      - name: Test actual Edge Function authorization logic with simulated Auth
        run: node tests/edge-auth.mjs
      - name: Install pinned browser test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.51.1
          npx playwright install --with-deps chromium
      - name: Test locally with simulated API only
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site &
          SERVER=$!
          trap 'kill "$SERVER" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/browser-smoke.mjs

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KontorKaffe-2.8-visual-QA
          path: visual-qa/
          if-no-files-found: ignore
          retention-days: 7
