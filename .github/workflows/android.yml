name: KontorKaffe APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'site/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android test APK
        run: gradle --no-daemon -p android :app:assembleDebug
      - name: Verify embedded administration and APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/kk/admin/index.html'
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk assets/kk/admin/index.html | grep 'BARISTA<br>2.7'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/kk/admin/barista.css'
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/kk/assets/linea-photo.webp'
          grep -q 'assets/linea-photo.webp' android/app/src/main/java/no/kontorkaffe/barista/MainActivity.java
          grep -q 'image/webp' android/app/src/main/java/no/kontorkaffe/barista/MainActivity.java
          node --input-type=module --check < site/admin/admin.js
          SDK_TOOL=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$SDK_TOOL" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "versionName='2.7'"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/KontorKaffe-Barista-2.7-test.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KontorKaffe-Barista-2.7-test
          path: dist/
          if-no-files-found: error
          retention-days: 30
